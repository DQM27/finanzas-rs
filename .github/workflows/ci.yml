name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos para todo el workflow.
permissions:
  contents: read

# Una subida nueva al mismo PR cancela la corrida anterior. En `main` no se
# cancela nada: cada commit tiene que quedar verificado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  formato:
    name: Formato (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    name: Lints (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  documentacion:
    name: Documentación (rustdoc sin avisos)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps

  # Un solo resultado para exigir en la protección de `main`.
  verificado:
    name: CI verde
    if: always()
    needs: [formato, clippy, pruebas, documentacion]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los trabajos pasaron
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "CI verde"
      - name: Algún trabajo falló
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
