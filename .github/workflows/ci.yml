name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos para todo el workflow.
permissions:
  contents: read

# Una subida nueva al mismo PR cancela la corrida anterior. En `main` no se
# cancela nada: cada commit tiene que quedar verificado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  formato:
    name: Formato (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    name: Lints (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # Los repositorios de SurrealDB contra un servidor real, con las mismas
  # pruebas de contrato que pasan los de memoria. La versión va fija: subirla
  # es un cambio a propósito, no algo que pase solo.
  contrato-surreal:
    name: Contrato con SurrealDB
    runs-on: ubuntu-latest
    env:
      SURREAL_VERSION: v4.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: SurrealDB ${{ env.SURREAL_VERSION }} en memoria
        run: |
          curl -sSfL "https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz" | tar xz
          ./surreal start --user root --pass root --bind 127.0.0.1:8000 memory &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - run: cargo test --locked -p finanzas-infra-surreal -- --ignored

  # Lo que va a correr en el Worker tiene que compilar a WebAssembly.
  wasm:
    name: Compila a WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p finanzas-dominio -p finanzas-aplicacion -p finanzas-infra-surreal -p finanzas-api -p finanzas-acceso -p finanzas-worker

  documentacion:
    name: Documentación (rustdoc sin avisos)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps

  # La PWA: que compile para producción y que pasen sus pruebas.
  web:
    name: PWA (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build
      - run: npx ng test --watch=false

  # Publica en Cloudflare, y sólo cuando todo lo de arriba quedó verde.
  #
  # Nunca desde un pull request: sólo al subir a `main`. Así el código de
  # afuera no puede desplegar ni ver los secretos.
  #
  # `wrangler deploy` corre el `[build]` de wrangler.toml, que compila primero
  # la PWA y después el Worker, así que aquí sólo hacen falta las herramientas.
  desplegar:
    name: Desplegar a Cloudflare
    needs: verificado
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Un despliegue no se cancela a la mitad: si llega otro commit, espera.
    concurrency:
      group: desplegar
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # `worker-build` no se instala aquí: lo hace el `[build]` de
      # wrangler.toml con su versión fija, para que la CI y la PC de Daniel
      # compilen con la misma.
      #
      # La versión mayor de wrangler también va fija: una versión nueva se
      # adopta a propósito, no en medio de un despliegue.
      - name: Publicar
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Un solo resultado para exigir en la protección de `main`.
  verificado:
    name: CI verde
    if: always()
    needs: [formato, clippy, pruebas, contrato-surreal, wasm, documentacion, web]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los trabajos pasaron
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "CI verde"
      - name: Algún trabajo falló
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
