<main class="pantalla">
  <h1>Finanzas</h1>

  @if (caja(); as c) {
    <section class="tarjeta" aria-labelledby="caja-titulo">
      <h2 id="caja-titulo">Caja chica</h2>
      <p class="cifra cifras">{{ c.queda | colones }}</p>
      @if (c.exceso > 0) {
        <p class="exceso cifras">Te pasaste {{ c.exceso | colones }}</p>
      }
      <p class="detalle">{{ c.desde | fechaCorta }} – {{ c.hasta | fechaCorta }}</p>
    </section>
  } @else if (falla(); as mensaje) {
    <p class="falla" role="alert">{{ mensaje }}</p>
  } @else {
    <p class="detalle" aria-live="polite">Cargando…</p>
  }
</main>
