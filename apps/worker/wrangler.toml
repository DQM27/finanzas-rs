# Worker de finanzas-rs. Pasos completos en docs/despliegue.md.
name = "finanzas-rs"
main = "build/index.js"
compatibility_date = "2026-11-01"

# Sólo se entra por el dominio propio, que es el que protege Cloudflare Access.
# workers.dev y las URL de vista previa quedan apagadas: serían una entrada
# sin Access.
workers_dev = false
preview_urls = false
routes = [{ pattern = "cf.megabrisas.com", custom_domain = true }]

[build]
# Primero la PWA (apps/web), después el Worker.
#
# `worker-build` va con versión fija y tiene que ir a la par del crate `worker`
# de Cargo.toml: exige que `worker` sea al menos su misma versión mayor y menor,
# así que worker-build 0.9 rechaza worker 0.8. Sin fijarlo, cada máquina compila
# con la versión que tenga instalada y el despliegue falla en la que esté al día.
command = "npm --prefix ../web ci --no-audit --no-fund && npm --prefix ../web run build && cargo install -q --locked worker-build@0.8.7 && worker-build --release"

# La PWA se sirve como archivos estáticos desde el mismo dominio, así que la
# sesión de Access es una sola. Sólo /api/* llega al código del Worker; una
# ruta de la app que no sea un archivo devuelve index.html y la resuelve el
# router de Angular.
[assets]
directory = "../web/dist/web/browser"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Nada de esto es secreto. Las claves van con `wrangler secret put`:
# SURREAL_USUARIO, SURREAL_CLAVE y USUARIOS.
[vars]
SURREAL_URL = "https://06gqbrtn9dv671ekf9ecbetue4.surrealdb.earth"
SURREAL_ESPACIO = "finanzas"
SURREAL_BASE = "produccion"
# Equipo de Zero Trust y etiqueta AUD de la aplicación de Access de cf.megabrisas.com.
ACCESO_EMISOR = "https://icy-field-7df6.cloudflareaccess.com"
ACCESO_AUDIENCIA = "e102eb434c8d758a666f10ddedc8d28ebb5fe0b31c1d2cf5c3d873f453ff0748"
ZONA_HORARIA_MINUTOS = "-360"
