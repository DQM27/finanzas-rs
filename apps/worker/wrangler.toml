# Worker de finanzas-rs. Pasos completos en docs/despliegue.md.
name = "finanzas-rs"
main = "build/index.js"
compatibility_date = "2026-11-01"

# Sólo se entra por el dominio propio, que es el que protege Cloudflare Access.
# workers.dev y las URL de vista previa quedan apagadas: serían una entrada
# sin Access.
workers_dev = false
preview_urls = false
routes = [{ pattern = "cf.megabrisas.com", custom_domain = true }]

[build]
command = "cargo install -q worker-build && worker-build --release"

# Nada de esto es secreto. Las claves van con `wrangler secret put`:
# SURREAL_USUARIO, SURREAL_CLAVE y USUARIOS.
[vars]
SURREAL_URL = "https://06gqbrtn9dv671ekf9ecbetue4.surrealdb.earth"
SURREAL_ESPACIO = "finanzas"
SURREAL_BASE = "produccion"
# Equipo de Zero Trust y etiqueta AUD de la aplicación de Access de cf.megabrisas.com.
ACCESO_EMISOR = "https://icy-field-7df6.cloudflareaccess.com"
ACCESO_AUDIENCIA = "e102eb434c8d758a666f10ddedc8d28ebb5fe0b31c1d2cf5c3d873f453ff0748"
ZONA_HORARIA_MINUTOS = "-360"
